name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Python / package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python tooling
        run: |
          python -m py_compile tools/serlink.py tools/stcflash.py tools/serial-console.py tools/serial-log.py \
            examples/sensor-probe/build.py examples/sensor-probe/build_test.py
      - name: Presence checks
        run: |
          test -f README.md && test -f LICENSE && test -f BSP/STCBSP_V3.6.LIB
          test -f tools/stcflash.py && test -f examples/sensor-probe/main.c
          echo "stcb-firmware-sdk package OK"
